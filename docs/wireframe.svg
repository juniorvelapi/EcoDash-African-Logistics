<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <rect width="960" height="640" fill="#f5f5f5"/>
  <rect x="20" y="20" width="920" height="520" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="18" fill="#333">MAIN GAME SCREEN (Canvas)</text>

  <rect x="40" y="70" width="280" height="110" fill="#ddd" stroke="#333"/>
  <text x="55" y="95" font-family="Arial, sans-serif" font-size="13">HUD: Score | Distance | Efficiency</text>
  <rect x="55" y="110" width="250" height="16" fill="#ccc" stroke="#333"/>
  <text x="55" y="145" font-family="Arial, sans-serif" font-size="12">Battery Meter</text>

  <rect x="810" y="70" width="110" height="110" fill="#ddd" stroke="#333"/>
  <text x="835" y="135" font-family="Arial, sans-serif" font-size="13">Mini-Map</text>

  <rect x="710" y="200" width="220" height="92" fill="#ddd" stroke="#333"/>
  <text x="725" y="225" font-family="Arial, sans-serif" font-size="12">Load-Shedding Schedule</text>
  <text x="725" y="250" font-family="Arial, sans-serif" font-size="11">(Original Feature)</text>

  <rect x="430" y="300" width="50" height="30" fill="#2a9d8f" stroke="#333"/>
  <text x="410" y="295" font-family="Arial, sans-serif" font-size="12">Player EV</text>

  <ellipse cx="250" cy="380" rx="30" ry="18" fill="#bbb" stroke="#333"/>
  <text x="220" y="420" font-family="Arial, sans-serif" font-size="11">Pothole</text>

  <rect x="600" y="350" width="80" height="40" fill="#bbb" stroke="#333"/>
  <text x="610" y="410" font-family="Arial, sans-serif" font-size="11">Solar Zone</text>

  <rect x="40" y="560" width="100" height="36" fill="#e07a2f" stroke="#333"/>
  <text x="55" y="583" font-family="Arial, sans-serif" font-size="12">Pause</text>

  <rect x="160" y="560" width="100" height="36" fill="#e07a2f" stroke="#333"/>
  <text x="178" y="583" font-family="Arial, sans-serif" font-size="12">Mute</text>

  <rect x="300" y="200" width="360" height="280" fill="rgba(0,0,0,0.1)" stroke="#666" stroke-dasharray="8,4"/>
  <text x="380" y="350" font-family="Arial, sans-serif" font-size="16" fill="#666">Start / Pause / Game Over Overlay</text>
</svg>
